name: C++ CMake CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: cmake-demo

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache CMake
        uses: actions/cache@v5
        with:
          path: ~/.cache
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/${{ matrix.build_type }}/cmake_demo.exe artifacts/
            cp build/${{ matrix.build_type }}/math_lib.dll artifacts/
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp build/cmake_demo artifacts/
            cp build/libmath_lib.dylib artifacts/
          else
            cp build/cmake_demo artifacts/
            cp build/libmath_lib.so artifacts/
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cmake-demo-${{ matrix.os }}-${{ matrix.build_type }}
          path: artifacts/
          retention-days: 7
  test:
    needs: build

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: cmake-demo-${{ matrix.os }}-${{ matrix.build_type }}
          path: artifacts/

      - name: Test job started
        run: echo "Test job is running"
  
  package:
    needs: test
    runs-on: ubuntu-latest

    env:
      PACKAGE_TYPE: release-package

    steps:
      - name: Download Ubuntu Release artifact
        uses: actions/download-artifact@v7
        with:
          name: cmake-demo-ubuntu-latest-Release
          path: build/

      - name: Create package
        run: |
          mkdir -p package
          tar -czf package/cmake-demo-release.tar.gz -C build .
          echo "CMake Demo Package" > package/README.txt

      - name: Show package contents
        run: |
          echo "Package contents:"
          ls -lh package/

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: cmake-demo-package
          path: package/
          retention-days: 7

      - name: Show application information
        run: |
          echo "Application: ${{ env.APP_NAME }}"
          echo "Package type: ${{ env.PACKAGE_TYPE }}"

      - name: Test GitHub Secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Secret is available to the workflow"
          echo "Secret length: ${#DEMO_SECRET}"
          
  upload-to-s3:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v7
        with:
          name: cmake-demo-package
          path: package/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::133197206066:role/GitHubActions-S3-Deploy
          aws-region: ap-south-2

      - name: Upload package to S3
        run: |
          VERSION="${{ github.ref_name }}"
          echo "Uploading version: ${VERSION}"
          aws s3 cp package/ \
            "s3://cmake-demo-umesh-2026-2306/releases/${VERSION}/" \
            --recursive
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download package artifact
        uses: actions/download-artifact@v7
        with:
          name: cmake-demo-package
          path: package/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            package/* \
            --title "CMake Demo ${{ github.ref_name }}" \
            --generate-notes
  deploy:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: cmake-demo-package
          path: deployment/

      - name: Deploy application
        run: |
          echo "Starting deployment..."
          echo "Deploying version: ${{ github.ref_name }}"
          echo "Deployment successful!"
